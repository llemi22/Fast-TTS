name: Build full Fast TTS package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: false
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: fast-tts-full-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Fast TTS repository
        uses: actions/checkout@v4

      - name: Integrate pinned qwen3-tts.cpp source and GGML
        shell: pwsh
        run: |
          if (Test-Path app) { Remove-Item app -Recurse -Force }
          ./SETUP_AND_BUILD.ps1 -SkipBuild
          if (!(Test-Path 'app/VOICEBOX_INTEGRATED_SOURCE.txt')) { throw 'Integrated source was not produced.' }
          if (Test-Path 'app/.git') { Remove-Item 'app/.git' -Recurse -Force }
          if (Test-Path 'app/ggml/.git') { Remove-Item 'app/ggml/.git' -Recurse -Force }

      - name: Install Hugging Face downloader
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub

      - name: Download qwen3-tts.cpp-compatible Q8 model and tokenizer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download('TeALO/qwen3-tts-gguf', filename='qwen3-tts-0.6b-q8_0.gguf', local_dir='models'); hf_hub_download('TeALO/qwen3-tts-gguf', filename='qwen3-tts-tokenizer-f16.gguf', local_dir='models')"
          if (!(Test-Path 'models/qwen3-tts-0.6b-q8_0.gguf')) { throw 'Talker model download failed.' }
          if (!(Test-Path 'models/qwen3-tts-tokenizer-f16.gguf')) { throw 'Tokenizer model download failed.' }
          Get-ChildItem models/*.gguf | Format-Table Name,Length

      - name: Validate package size budget
        shell: pwsh
        run: |
          $modelBytes = (Get-ChildItem models/*.gguf | Measure-Object Length -Sum).Sum
          Write-Host "Model bytes: $modelBytes"
          if ($modelBytes -gt 1850000000) { throw 'Model payload unexpectedly exceeds the release size budget.' }

      - name: Create one full package ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'Fast_TTS_FULL'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Get-ChildItem -Force | Where-Object {
            $_.Name -notin @('.git', 'models', 'Fast_TTS_FULL_WITH_MODELS.zip', 'SHA256SUMS.txt')
          } | ForEach-Object {
            Copy-Item $_.FullName $stage -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'models') | Out-Null
          Copy-Item models/*.gguf (Join-Path $stage 'models') -Force

          @"
          Fast TTS full package

          Included runtime model files:
          - models/qwen3-tts-0.6b-q8_0.gguf
          - models/qwen3-tts-tokenizer-f16.gguf

          Model source: TeALO/qwen3-tts-gguf
          Model license: Apache-2.0
          Runtime foundation: predict-woo/qwen3-tts.cpp (MIT)
          Upstream runtime commit: b3ba14077cf1b3e11b86e5f84aa9184605c89b28

          The app/ directory contains the pinned upstream source, pinned GGML source,
          and the Fast TTS streaming modifications integrated into that source tree.
          "@ | Set-Content (Join-Path $stage 'MODEL_AND_LICENSE_NOTES.txt') -Encoding UTF8

          $zip = Join-Path $PWD 'Fast_TTS_FULL_WITH_MODELS.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          & 7z a -tzip -mx=0 $zip "$stage\*"
          if ($LASTEXITCODE -ne 0) { throw '7-Zip packaging failed.' }

          $size = (Get-Item $zip).Length
          Write-Host "Release ZIP bytes: $size"
          if ($size -ge 2147483648) { throw 'Release ZIP is >= 2 GiB and exceeds GitHub release asset limit.' }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Fast_TTS_FULL_WITH_MODELS.zip" | Set-Content SHA256SUMS.txt -Encoding ASCII
          Get-Content SHA256SUMS.txt

      - name: Publish or replace GitHub Release package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || 'v0.1.0' }}
        run: |
          $notes = @"
          Fast TTS full package.

          One ZIP containing:
          - integrated qwen3-tts.cpp source
          - pinned GGML source
          - Fast TTS low-latency streaming VoiceBox modifications
          - compatible Q8 Qwen3-TTS model
          - compatible speech tokenizer/vocoder model
          - Windows setup/build/run scripts

          Model weights are Apache-2.0. Runtime foundation is MIT.
          "@

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG Fast_TTS_FULL_WITH_MODELS.zip SHA256SUMS.txt --clobber
          } else {
            gh release create $env:TAG Fast_TTS_FULL_WITH_MODELS.zip SHA256SUMS.txt --title "Fast TTS $env:TAG" --notes $notes
          }
