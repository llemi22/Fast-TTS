name: Validate Windows VoiceBox

on:
  push:
    branches: [main]
    paths:
      - 'SETUP_AND_BUILD.ps1'
      - 'RUN_VOICEBOX.ps1'
      - 'SETUP_LIVE_SPEECH.ps1'
      - 'RUN_LIVE_SPEECH.ps1'
      - 'LIVE_SPEECH.md'
      - 'live_speech/**'
      - 'PREPARE_MODELS.ps1'
      - 'README.md'
      - 'voicebox_17/**'
      - 'voicebox_overlay/**'
      - '.github/workflows/validate-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SETUP_AND_BUILD.ps1'
      - 'RUN_VOICEBOX.ps1'
      - 'SETUP_LIVE_SPEECH.ps1'
      - 'RUN_LIVE_SPEECH.ps1'
      - 'LIVE_SPEECH.md'
      - 'live_speech/**'
      - 'PREPARE_MODELS.ps1'
      - 'README.md'
      - 'voicebox_17/**'
      - 'voicebox_overlay/**'
      - '.github/workflows/validate-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-tts-windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-cpu-compile:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Fast TTS
        uses: actions/checkout@v4

      - name: Verify hardening invariants
        shell: pwsh
        run: |
          if (Test-Path '.\voicebox_overlay') {
            throw 'Legacy voicebox_overlay must not exist in the active repository.'
          }

          $sourcePath = '.\voicebox_17\fast_tts_voicebox_hardened.cpp'
          if (-not (Test-Path $sourcePath)) { throw 'Hardened VoiceBox source is missing.' }
          $source = Get-Content $sourcePath -Raw

          $required = @(
            'CALLBACK_NULL',
            'valid_voice_id',
            'class JsonReader',
            'OUTPUT_SAMPLE_RATE = 24000',
            'p.cancel = &Engine::cancel_cb',
            'Voice switch failed; previous voice remains active.'
          )
          foreach ($needle in $required) {
            if (-not $source.Contains($needle)) { throw "Missing hardening invariant: $needle" }
          }

          $readme = Get-Content '.\README.md' -Raw
          if ($readme -match 'C:\\Users\\lukel') {
            throw 'README contains a machine-specific username path.'
          }

      - name: Validate live speech bridge
        shell: pwsh
        run: |
          foreach ($script in @('.\RUN_VOICEBOX.ps1', '.\SETUP_LIVE_SPEECH.ps1', '.\RUN_LIVE_SPEECH.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $message = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parse failed for ${script}: $message"
            }
          }

          python -m py_compile .\live_speech\live_stt_tts.py
          if ($LASTEXITCODE -ne 0) { throw 'Live speech Python syntax validation failed.' }
          python .\live_speech\live_stt_tts.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Live speech commit/chunker self-test failed.' }

          $runner = Get-Content '.\RUN_LIVE_SPEECH.ps1' -Raw
          foreach ($needle in @(
            "WhisperModel = 'turbo'",
            "ComputeType = 'float16'",
            'StepMs = 240',
            'MinDecodeMs = 360',
            'EndpointMs = 320',
            'TailWords = 1',
            'MinChunkWords = 2',
            'MaxChunkWords = 5',
            'WarmupMs = 700',
            'RUN_VOICEBOX.ps1',
            'Detached'
          )) {
            if (-not $runner.Contains($needle)) { throw "Missing live runner invariant: $needle" }
          }

          $bridge = Get-Content '.\live_speech\live_stt_tts.py' -Raw
          foreach ($needle in @('latency="low"', 'last_decode_started', 'Whisper warmup complete')) {
            if (-not $bridge.Contains($needle)) { throw "Missing live bridge latency invariant: $needle" }
          }

      - name: Build native VoiceBox against pinned qwentts.cpp
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\SETUP_AND_BUILD.ps1 -Fresh -CpuOnly

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem .\app\build-fast -Recurse -Filter fast-tts-voicebox.exe | Select-Object -First 1
          if (-not $exe) { throw 'fast-tts-voicebox.exe was not produced.' }
          Write-Host "Validated: $($exe.FullName)"
